# junto-iced — SPIKE: a native (Iced) multi-channel pane workspace over the
# junto host. Deliberately its OWN workspace, excluded from the kernel one:
# Iced's dependency tree is large (same reasoning as junto-desktop). See
# docs/native-ui-toolkit-assessment.md.
[package]
name = "junto-iced"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Spike: a native (Iced) multi-channel pane workspace over the junto host"

[dependencies]
# "advanced" exposes `iced::advanced` (Widget/Overlay/Tree). Required because
# Iced 0.13 has no popover primitive: an interactive floating panel must be a
# custom Widget returning a real Overlay (`src/popover.rs`) — `tooltip`'s
# overlay is draw-only and its content cannot be clicked or focused.
iced = { version = "0.14", features = ["tokio", "image", "canvas", "markdown", "advanced"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native folder picker for the launch workspace (MIT, cross-platform).
rfd = "0.15"
# Open clicked Markdown links in the OS default browser (MIT, cross-platform).
open = "5"
# Remote live-session watching (Task 9, live-session-plane): the
# authenticated websocket client, the shared wire/CRDT/presence types, and
# the signing-key/keys.toml plumbing. Pinned to 0.29 — the version the host
# side (`crates/junto`) resolves to via axum's `ws` feature; 0.24 was tried
# first and produced a duplicate-version resolution, so this pin is load-bearing.
# `rustls-tls-webpki-roots` matches reqwest's own `rustls-tls` feature above
# (which expands to the same webpki-roots + ring pairing) — without it,
# `wss://` (an https-fronted remote host) fails to connect at all.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# `iced`'s own "tokio" feature already runs the app on a tokio runtime and
# pulls the `tokio` crate in transitively (also required by
# `tokio-tungstenite`'s "connect" feature) — named directly here only for
# the heartbeat timer (`time`) and the connection's `select!` loop (`macros`).
tokio = { version = "1", default-features = false, features = ["time", "macros"] }
junto-kernel = { path = "../junto-kernel" }
junto-live = { path = "../junto-live" }
toml = "0.9"
# Decodes CDP `Page.screencastFrame` JPEG frames (base64 on the wire). Already
# in the lock file transitively at this version, so naming it moves no resolution.
base64 = "0.22"

[workspace]

[dev-dependencies]
iced_test = "0.14"
# standalone — see the header comment
