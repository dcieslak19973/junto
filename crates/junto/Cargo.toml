[package]
name = "junto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "junto — host/app entry point"

[lib]
name = "junto"
path = "src/lib.rs"

[[bin]]
name = "junto"
path = "src/main.rs"

[dependencies]
junto-kernel.workspace = true
junto-live.workspace = true
junto-substrate-git.workspace = true
anyhow.workspace = true
# the MCP write surface (`junto serve`): streamable HTTP over axum
rmcp.workspace = true
# the `ws` feature is the live-session-plane websocket endpoint
# (crates/junto/src/live_ws.rs): challenge-response auth + Frame streaming.
axum = { workspace = true, features = ["ws"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
toml.workspace = true
dunce.workspace = true
# member-code minting (docs/adr/0017) reuses the workspace's entropy source
uuid.workspace = true
# artifact content digests (docs/adr/0023 capture)
sha2.workspace = true
# live-progress stream over SSE (docs/adr/0023): per-session broadcast → EventSource
async-stream.workspace = true
# render agent memos as CommonMark on the human surface (docs/adr/0023)
pulldown-cmark.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
# the live websocket integration test's client side (crates/junto/tests/live_ws.rs);
# dev-only, per the live-session-plane plan's dependency ruling.
tokio-tungstenite.workspace = true
# `WebSocketStream`'s Sink/Stream impls need these traits in scope to call
# `.send()`/`.next()`; already fully resolved in the workspace's dependency
# tree via axum/tokio, so this adds no new crate, only a direct import path.
futures-util.workspace = true
